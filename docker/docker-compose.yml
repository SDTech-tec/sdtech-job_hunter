version: "3.9"

# ============================================================
# SDTech Soluctions — Docker Compose (Desenvolvimento Local)
# ============================================================
# ATENÇÃO: Este arquivo é para desenvolvimento local APENAS.
# Para produção, use o PostgreSQL existente na rede sdtech-net
# do servidor Oracle Cloud.
#
# Porta: 5434 (evita conflito com sdbase na 5433)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — Banco dedicado ao SDTech Soluctions
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sdtech-soluctions-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-sdtech_owner}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-CHANGE_ME_OWNER_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-sdtech_soluctions}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      # Porta local 5434 para evitar conflito com sdbase (5433)
      - "${DB_PORT:-5434}:5432"

    volumes:
      - sdtech_soluctions_pgdata:/var/lib/postgresql/data

    networks:
      - sdtech-soluctions-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-sdtech_owner} -d ${DB_NAME:-sdtech_soluctions}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Configurações de performance mínimas para desenvolvimento
    command: >
      postgres
        -c log_min_duration_statement=1000
        -c log_connections=off
        -c shared_preload_libraries=''

  # ----------------------------------------------------------
  # Redis — Preparado para uso futuro (cache, filas, sessões)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sdtech-soluctions-redis
    restart: unless-stopped

    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
        --appendonly yes
        --loglevel warning

    ports:
      - "6380:6379"

    volumes:
      - sdtech_soluctions_redis_data:/data

    networks:
      - sdtech-soluctions-net

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ----------------------------------------------------------
# Volumes persistentes
# ----------------------------------------------------------
volumes:
  sdtech_soluctions_pgdata:
    driver: local
    name: sdtech_soluctions_pgdata

  sdtech_soluctions_redis_data:
    driver: local
    name: sdtech_soluctions_redis_data

# ----------------------------------------------------------
# Rede isolada (dev local)
# Em produção usar: sdtech-net (external: true)
# ----------------------------------------------------------
networks:
  sdtech-soluctions-net:
    driver: bridge
    name: sdtech-soluctions-net
