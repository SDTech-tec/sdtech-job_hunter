<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Site em manutenção</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#0f0f0f;color:#e0e0e0;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{max-width:480px;padding:2rem;border:1px solid #444;border-radius:12px;background:rgba(255,255,255,0.05);backdrop-filter:blur(8px);text-align:center}
    h1{font-size:2rem;margin-bottom:.5rem;color:#fff}
    p{margin:0;color:#bbb}
  </style>
</head>
<body>
  <div class="box">
    <h1>Site em manutenção</h1>
    <p>Estamos realizando melhorias. Em breve o site voltará ao ar.</p>
  </div>
</body>
</html>
